<text x="360" y="364.47" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#294D64">Harbor Lantern Hotel</text>
<text x="84" y="407.36" font-family="Arial, sans-serif" font-size="24" font-weight="normal" fill="#19354D">city</text>
<text x="360" y="406.47" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#294D64">Boston</text>
